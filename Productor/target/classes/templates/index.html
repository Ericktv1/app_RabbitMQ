<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <title>Cliente · Realiza tu pedido</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
        :root{
          --bg:#0b1020; --panel:#11183a; --muted:#8ea2c8; --text:#eaf1ff;
          --brand:#6aa4ff; --brand-2:#8ee3ff; --ok:#19c37d; --warn:#ffc857; --danger:#ff6b6b;
          --border:rgba(255,255,255,.12); --shadow:0 12px 30px rgba(0,0,0,.35); --radius:18px;
        }
        *{box-sizing:border-box}
        html,body{height:100%}
        body{
          margin:0; font-family: ui-sans-serif, system-ui, Segoe UI, Roboto, Helvetica, Arial;
          background:linear-gradient(180deg,#0a0f23 0%,#0b1020 100%); color:var(--text);
          display:flex; flex-direction:column; gap:24px;
        }
        .container{max-width:1200px;margin:24px auto;padding:0 16px}
        header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}
        .title{font-size:28px;font-weight:800;letter-spacing:.2px}
        .card{background:linear-gradient(180deg,#0e1540 0%, #0d1335 100%);border:1px solid var(--border); border-radius:var(--radius);box-shadow:var(--shadow);}
        .panel{padding:18px 18px}
        .row{display:grid;grid-template-columns:1fr 320px; gap:18px}
        @media (max-width:900px){ .row{grid-template-columns:1fr} }
        .input,.select{width:100%; background:#0c1330;border:1px solid var(--border); color:var(--text);padding:12px 14px;border-radius:12px;}
        .muted{color:var(--muted);font-size:14px}
        .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px}
        @media (max-width:640px){ .grid{grid-template-columns:1fr} }
        .prod{display:grid; grid-template-columns:1fr auto; gap:10px; align-items:center;background:rgba(255,255,255,.03); border:1px solid var(--border);padding:14px; border-radius:14px;}
        .prod h4{margin:0;font-size:16px}
        .price{color:var(--brand-2);font-weight:700}
        .qty{display:flex; align-items:center; gap:6px; background:#0b1230;border:1px solid var(--border); border-radius:12px; padding:4px;}
        .qty button{width:32px; height:32px; border-radius:10px; border:1px solid var(--border);background:linear-gradient(180deg,#16245d,#0d1745); color:var(--text); cursor:pointer;}
        .qty input{width:52px; text-align:center; border:none; background:transparent; color:var(--text); font-weight:700;}
        .summary{position:sticky; top:16px;display:flex; flex-direction:column; gap:12px;}
        .tot{display:flex; align-items:center; justify-content:space-between;padding:14px 16px; border:1px dashed var(--border); border-radius:14px;background:rgba(255,255,255,.03);font-weight:700;}
        .btn{appearance:none; border:none; cursor:pointer; width:100%;padding:14px 16px; border-radius:14px; font-weight:800;letter-spacing:.3px;color:#071024; background:linear-gradient(180deg, var(--brand), #4d7fff);}
        .alert{padding:12px 14px; border-radius:12px; font-weight:600}
        .alert.info{background:rgba(106,164,255,.12); border:1px solid rgba(106,164,255,.35)}
        .alert.ok{background:rgba(25,195,125,.12); border:1px solid rgba(25,195,125,.35)}
        .alert.err{background:rgba(255,107,107,.12); border:1px solid rgba(255,107,107,.35)}
        .badge{font-size:12px; padding:4px 8px; border-radius:999px; background:rgba(255,255,255,.08); border:1px solid var(--border)}
        table{width:100%; border-collapse:collapse}
        th,td{padding:10px; border-bottom:1px solid var(--border)}
        th{background:rgba(255,255,255,.05); text-align:left}
        .right{text-align:right}
        .toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
        .btn-mini{appearance:none; border:1px solid var(--border); background:#0c1330; color:var(--text); padding:8px 12px; border-radius:10px; cursor:pointer}
    </style>
</head>
<body>
<div class="container">
    <header>
        <div class="title">🍽️ Realiza tu pedido</div>
    </header>

    <div class="row">
        <section class="card">
            <div class="panel">
                <div style="display:flex; gap:12px; align-items:center; margin-bottom:12px; flex-wrap:wrap">
                    <input id="customerName" class="input" placeholder="Tu nombre" style="max-width:280px">
                    <select id="cuisine" class="select" style="max-width:220px">
                        <option value="ITALIANA">Cocina Italiana</option>
                        <option value="ASIATICA">Cocina Asiática</option>
                    </select>
                    <span class="muted">Elige tu cocina; los precios ya incluyen promociones activas.</span>
                </div>

                <!-- Banner de promoción activa -->
                <div id="promoBanner" class="alert info" style="display:none"></div>

                <div class="grid" id="catalog"></div>
            </div>
        </section>

        <aside class="summary">
            <div class="card panel">
                <div class="muted">Resumen</div>
                <div class="tot"><span>Total estimado</span><span id="est">$ 0</span></div>
                <button id="send" class="btn">Enviar pedido</button>
            </div>

            <!-- Resultado del envío + tracking -->
            <div id="result" class="alert info" style="display:none"></div>
            <div id="orderStatus" class="alert info" style="display:none"></div>
        </aside>
    </div>

    <!-- MIS FACTURAS -->
    <section class="card">
        <div class="panel">
            <div class="toolbar">
                <h2 style="margin:0">Mis Facturas</h2>
                <button id="refreshInvoices" class="btn-mini">Actualizar</button>
            </div>
            <table>
                <thead>
                <tr>
                    <th>OrdenID</th><th>Cliente</th><th class="right">Subtotal</th><th class="right">IVA</th><th class="right">Total</th>
                </tr>
                </thead>
                <tbody id="tbInvoices"></tbody>
            </table>
        </div>
    </section>

    <!-- NOTIFICACIONES -->
    <section class="card">
        <div class="panel">
            <div class="toolbar">
                <h2 style="margin:0">Notificaciones</h2>
                <button id="refreshNotifications" class="btn-mini">Actualizar</button>
            </div>
            <div id="notificationsList" style="display:flex; flex-direction:column; gap:12px"></div>
        </div>
    </section>
</div>

<script>
    const fmtCOP = n => Number(n).toLocaleString('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0});
    const selCuisine = () => document.getElementById('cuisine').value;
    let catalog = {};             // { nombre: precio }
    let watchTimer = null;        // intervalo para trackear última orden
    let lastOrderId = null;       // id del último pedido enviado

    function qtyInputs(){ return document.querySelectorAll('#catalog .qty input'); }

    async function loadCatalog(){
      // Guarda cantidades actuales
      const currentQty = {};
      document.querySelectorAll('#catalog .qty input').forEach(inp => {
        currentQty[inp.dataset.name] = inp.value;
      });

      const res = await fetch(`/orders/catalog?cuisine=${encodeURIComponent(selCuisine())}`);
      catalog = await res.json();

      buildCatalog();

      // Restaura cantidades previas
      document.querySelectorAll('#catalog .qty input').forEach(inp => {
        if (currentQty[inp.dataset.name] !== undefined) {
          inp.value = currentQty[inp.dataset.name];
        }
      });

      showActivePromo();
      updateEstimate();
    }

    function buildCatalog(){
      const grid = document.getElementById('catalog'); grid.innerHTML='';
      Object.entries(catalog).forEach(([name, price])=>{
        const el = document.createElement('div');
        el.className='prod';
        el.innerHTML = `
          <div>
            <h4>${name} <span class="badge">${fmtCOP(price)}</span></h4>
          </div>
          <div class="qty">
            <button type="button" data-d="-1">-</button>
            <input type="number" min="0" value="0" data-name="${name}">
            <button type="button" data-d="1">+</button>
          </div>`;
        const input = el.querySelector('input');
        el.querySelectorAll('button').forEach(b=>{
          b.addEventListener('click', ()=>{
            const d = Number(b.dataset.d);
            const v = Math.max(0, Number(input.value||0) + d);
            input.value = v; updateEstimate();
          });
        });
        input.addEventListener('input', updateEstimate);
        grid.appendChild(el);
      });
    }

    function updateEstimate(){
      let total = 0;
      qtyInputs().forEach(inp=>{
        const name = inp.dataset.name;
        const q = parseInt(inp.value||'0',10);
        total += (Number(catalog[name]||0) * q);
      });
      document.getElementById('est').textContent = fmtCOP(total);
    }

    function showNotice(html, type='info'){
      const box = document.getElementById('result');
      box.className = `alert ${type}`; box.style.display='block'; box.innerHTML = html;
    }

    async function showActivePromo(){
      const res = await fetch(`/orders/promotions/active?cuisine=${encodeURIComponent(selCuisine())}`);
      const p = await res.json().catch(()=>null);
      const box = document.getElementById('promoBanner');
      if(!p || !p.active){
        box.style.display='none'; box.innerHTML=''; return;
      }
      if(p.type === 'DESCUENTO'){
        box.className = 'alert info';
        box.innerHTML = `🔥 Promoción activa: <b>${Math.round(p.percent*100)}% OFF</b> en toda la cocina.`;
      }else if(p.type === '2X1'){
        box.className = 'alert info';
        box.innerHTML = `🔥 Promoción activa: <b>2x1</b> en <b>${p.product}</b>.`;
      }
      box.style.display='block';
    }

    // ===== Tracking de estado del último pedido =====
    function showOrderStatus(html, type='info'){
      const box = document.getElementById('orderStatus');
      box.className = `alert ${type}`; box.style.display='block'; box.innerHTML = html;
    }
    function clearOrderStatus(){
      const box = document.getElementById('orderStatus');
      box.style.display = 'none'; box.innerHTML = '';
    }

    function startTracking(orderId){
      lastOrderId = orderId;
      clearInterval(watchTimer);
      showOrderStatus('⏳ Esperando respuesta del restaurante...', 'info');

      // Consulta cada 2s si hay factura o rechazo para ese orderId
      watchTimer = setInterval(async ()=>{
        // 1) ¿hay factura?
        const fRes = await fetch(`/invoices/order/${encodeURIComponent(orderId)}`);
        if (fRes.ok){
          const factura = await fRes.json();
          if (factura && factura.id){ // llegó factura
            showOrderStatus(
              `✅ Pedido <b>ACEPTADO</b>.<br>
               <b>Factura</b> — Subtotal: ${fmtCOP(factura.subtotal)}, IVA: ${fmtCOP(factura.tax)}, Total: <b>${fmtCOP(factura.total)}</b>`,
              'ok'
            );
            clearInterval(watchTimer);
            loadInvoices(); // refresca tabla
            return;
          }
        }

        // 2) ¿hay notificación de rechazo?
        const nRes = await fetch(`/notifications/order/${encodeURIComponent(orderId)}`);
        if (nRes.ok){
          const notif = await nRes.json();
          if (notif && notif.tipo === 'DENEGADO'){
            showOrderStatus(`❌ Pedido <b>DENEGADO</b> — ${notif.mensaje}`, 'err');
            clearInterval(watchTimer);
            loadNotifications(); // refresca lista
            return;
          }
        }
      }, 2000);
    }

    // ===== Eventos principales =====
    document.getElementById('cuisine').addEventListener('change', ()=>{
      clearOrderStatus();
      loadCatalog();
    });

    document.getElementById('send').addEventListener('click', async ()=>{
      const customerName = document.getElementById('customerName').value.trim();
      if(!customerName){ showNotice('⚠️ Escribe tu nombre','err'); return; }

      const items=[]; qtyInputs().forEach(inp=>{
        const q = parseInt(inp.value||'0',10); for(let i=0;i<q;i++) items.push(inp.dataset.name);
      });
      if(items.length===0){ showNotice('⚠️ Selecciona al menos un producto','err'); return; }

      const res = await fetch('/orders',{ method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({customerName, items, cuisine: selCuisine()}) });
      const data = await res.json();

      showNotice(`Pedido enviado ✅ (ID: <b>${data.orderId}</b>).<br>Esperando confirmación del restaurante...`,'ok');

      // Comienza a trackear esta orden para mostrar factura/denegación
      startTracking(data.orderId);

      // Limpia cantidades
      qtyInputs().forEach(inp => inp.value = '0'); updateEstimate();
    });

    // ===== Facturas (lista) =====
    async function loadInvoices(){
      try{
        const res = await fetch('/invoices');
        const invoices = await res.json();
        const tb = document.getElementById('tbInvoices'); tb.innerHTML = '';
        if(!Array.isArray(invoices) || invoices.length===0){
          tb.innerHTML = '<tr><td colspan="5" style="text-align:center; color:var(--muted); padding:14px">No hay facturas</td></tr>';
          return;
        }
        invoices.forEach(inv=>{
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${inv.orderId}</td>
            <td>${inv.customerName}</td>
            <td class="right">${fmtCOP(inv.subtotal)}</td>
            <td class="right">${fmtCOP(inv.tax)}</td>
            <td class="right">${fmtCOP(inv.total)}</td>`;
          tb.appendChild(tr);
        });
      }catch(e){/* noop */}
    }
    document.getElementById('refreshInvoices').onclick = loadInvoices;

    // ===== Notificaciones (lista) =====
    async function loadNotifications(){
      try{
        const res = await fetch('/notifications');
        const list = await res.json();
        const box = document.getElementById('notificationsList');
        box.innerHTML = '';
        if(!Array.isArray(list) || list.length===0){
          box.innerHTML = '<div style="text-align:center; color:var(--muted); padding:12px">No hay notificaciones</div>';
          return;
        }
        list.forEach(n=>{
          const div = document.createElement('div');
          const isDenied = n.tipo === 'DENEGADO';
          div.className = `alert ${isDenied ? 'err' : 'ok'}`;
          div.innerHTML = `
            <strong>${isDenied ? '❌ Pedido Rechazado' : '✅ Pedido Aceptado'}</strong><br>
            <span style="font-size:14px">Pedido ID: ${n.orderId}</span><br>
            <span>${n.mensaje||''}</span>`;
          box.appendChild(div);
        });
      }catch(e){/* noop */}
    }
    document.getElementById('refreshNotifications').onclick = loadNotifications;

    // ===== Auto-refresh ligero =====
    setInterval(()=>{ loadCatalog(); }, 5000);
    setInterval(()=>{ loadInvoices(); loadNotifications(); }, 6000);

    // Inicial
    loadCatalog();
    loadInvoices();
    loadNotifications();
</script>
</body>
</html>
